name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.skill }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        skill: [devboard-electronics, devboard-profiles]

    defaults:
      run:
        working-directory: ${{ matrix.skill }}

    steps:
      - uses: actions/checkout@v4

      # 3.12, not 3.13+: neither skill needs OpenCASCADE, but they must not
      # create an environment the paired cad-skill cannot share.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.skill }}/requirements.txt

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q

  cross-skill:
    name: profiles lint the installed electronics profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r devboard-profiles/requirements.txt

      # The pairing check: every board and part profile that ships must be
      # self-consistent AND carry a machine-checkable reason to be believed.
      # A profile nobody checked is a confident answer with nothing behind it.
      #
      # Deliberately NOT --strict. Under strict, an honestly unresolved
      # contradiction (two vendor documents disagreeing, nobody having measured
      # it) becomes an error - which would create pressure to "resolve" a
      # disagreement by picking a side. That is exactly the behaviour this skill
      # forbids. Errors fail the build; recorded disagreements do not.
      - name: Every shipped profile is corroborated
        run: |
          python devboard-profiles/profile_lint.py --all \
            --parent devboard-electronics

      - name: Audit what the electronics skill believes
        run: |
          python devboard-profiles/profiles.py audit \
            --parent devboard-electronics
